name: Build DSH Full App (iSH + dsh)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dsh-app-src/**'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone iSH (with submodules)
        run: |
          git clone --recursive https://github.com/ish-app/ish.git ish-src
          cd ish-src

      - name: Apply DSH customizations
        run: |
          cp dsh-app-src/Roots.m ish-src/app/Roots.m
          cp dsh-app-src/Roots.h ish-src/app/Roots.h

      - name: Install build deps
        run: |
          brew install meson ninja llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
          meson --version && ninja --version

      - name: Build iSH kernel + app
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          cd ish-src
          which clang lld ld.lld || true
          ls *.xcodeproj
          xcodebuild -project iSH.xcodeproj -scheme iSH \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/dsh \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Rename + package
        run: |
          cd ish-src
          APP=build/dsh.xcarchive/Products/Applications/iSH.app
          mkdir -p dist/Payload
          cp -r $APP dist/Payload/DSH.app
          cd dist
          zip -qry dsh.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dsh-full.ipa
          path: ish-src/dist/dsh.ipa
